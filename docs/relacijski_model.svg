<text x="40" y="544" font-size="13" fill="#73726c">Narudžba mora imati barem jednu stavku: to pravilo provodi API (validacija [MinLength(1)]), a ne sama baza.</text>
<text x="40" y="566" font-size="13" fill="#73726c">Brisanje: Orders -&gt; OrderItems CASCADE; Tables -&gt; Orders i MenuItems -&gt; OrderItems RESTRICT. Name i UnitPrice u OrderItems su snapshot.</text>
