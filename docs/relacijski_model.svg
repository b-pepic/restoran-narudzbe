<text x="40" y="522" font-size="13" fill="#73726c">Primjer čitanja (tables - orders): svaka narudžba mora imati točno jedan stol; stol može imati nula ili više narudžbi.</text>
<text x="40" y="544" font-size="13" fill="#73726c">Narudžba mora imati barem jednu stavku: to pravilo provodi API (validacija [MinLength(1)]), a ne sama baza.</text>
<text x="40" y="566" font-size="13" fill="#73726c">Brisanje: orders -&gt; order_items CASCADE; tables -&gt; orders i menu_items -&gt; order_items RESTRICT. name i unit_price u order_items su snapshot.</text>
